<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="utf-8">
<title>Avatar Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&display=swap">
<style>
:root{--bg:#F5F7FA;--fg:#14181F;--mut:#5B6472;--card:#fff;--line:#DDE2EA;--acc:#0F9D8A;--accfg:#fff;--warm:#E8A33D;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--fg:#EEF1F5;--mut:#9AA4B2;--card:#1B212A;--line:#2C3541;--acc:#2CC4AE;--accfg:#06201C}}
:root[data-theme="dark"]{--bg:#12161C;--fg:#EEF1F5;--mut:#9AA4B2;--card:#1B212A;--line:#2C3541;--acc:#2CC4AE;--accfg:#06201C}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Sora,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:20px;font-weight:600;margin:4px 0 12px}
.stage{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center}
.stage img,.stage video{width:100%;height:100%;object-fit:cover;display:block;transition:filter .4s,transform .4s}
.stage.talk img{animation:sway .6s ease-in-out infinite alternate}
.stage.talk::after{content:"";position:absolute;inset:0;border-radius:16px;box-shadow:inset 0 0 0 3px var(--acc);animation:pulse .7s ease-in-out infinite alternate;pointer-events:none}
@keyframes sway{from{transform:scale(1) rotate(-.4deg)}to{transform:scale(1.025) rotate(.4deg)}}
@keyframes pulse{from{opacity:.25}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.stage.talk img,.stage.talk::after{animation:none}}
.ph{color:var(--mut);text-align:center;padding:24px;font-size:14px}
.sub{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(10,12,16,.78);color:#fff;border-radius:10px;padding:8px 10px;font-size:15px;min-height:40px;text-align:center}
.sub b{color:var(--warm);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
button,select,textarea{font:inherit;color:var(--fg)}
button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.pri{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
button.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.chip{padding:8px 12px;min-height:40px}
select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
#st{font-size:13px;color:var(--mut);min-height:20px;margin-top:8px}
input[type=file]{display:none}
.fig{position:absolute;inset:0;--top:#2E7D5B;--bot:#fff;--shoe:#222;background:linear-gradient(#9fd3ff,#6dbb6a 70%,#4f9a50)}
.fig[hidden]{display:none}
.fw{position:absolute;inset:0}
.fw svg{position:absolute;left:0;right:0;bottom:44px;width:100%;height:78%}
.head{position:absolute;left:50%;top:9%;width:38%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;overflow:hidden;border:3px solid var(--card);z-index:2}
.head img{width:100%;height:100%;object-fit:cover;display:block}
#mouth{position:absolute;left:50%;top:72%;width:26%;height:2%;background:#3a1218;border-radius:50%;transform:translateX(-50%);opacity:0}
.top{fill:var(--top)}.bot{fill:var(--bot)}.shoe{fill:var(--shoe)}.skin{fill:#C98F6B}
.fw svg g{transform-box:fill-box;transform-origin:50% 0}
.fig.dance .fw{animation:bob .5s ease-in-out infinite alternate}
.fig.dance .armL{animation:swL .5s ease-in-out infinite alternate}
.fig.dance .armR{animation:swR .5s ease-in-out infinite alternate}
.fig.sport .fw{animation:jump .4s ease-in-out infinite alternate}
.fig.sport .legL,.fig.sport .armR{animation:swL .25s linear infinite alternate}
.fig.sport .legR,.fig.sport .armL{animation:swR .25s linear infinite alternate}
@keyframes bob{to{transform:translateY(-8px) rotate(2deg)}}
@keyframes jump{to{transform:translateY(-22px)}}
@keyframes swL{from{transform:rotate(-35deg)}to{transform:rotate(35deg)}}
@keyframes swR{from{transform:rotate(35deg)}to{transform:rotate(-35deg)}}
@media (prefers-reduced-motion:reduce){.fig *{animation:none!important}}
</style>
</head>
<body>
<main>
<h1>Avatar Studio</h1>
<div class="stage" id="stage">
  <div class="ph" id="ph">Suuraa fuula olkaa'i ykn kaameraa banii suuraa kaasi.</div>
  <div class="fig" id="fig" hidden><div class="fw"><svg viewBox="0 0 200 300" aria-hidden="true"><g class="legL"><rect class="bot" x="78" y="188" width="19" height="78" rx="9"/><rect class="shoe" x="72" y="260" width="30" height="13" rx="6"/></g><g class="legR"><rect class="bot" x="103" y="188" width="19" height="78" rx="9"/><rect class="shoe" x="98" y="260" width="30" height="13" rx="6"/></g><rect class="top" x="68" y="100" width="64" height="98" rx="16"/><g class="armL"><rect class="top" x="50" y="104" width="17" height="72" rx="8"/><circle class="skin" cx="58" cy="182" r="9"/></g><g class="armR"><rect class="top" x="133" y="104" width="17" height="72" rx="8"/><circle class="skin" cx="142" cy="182" r="9"/></g><rect class="skin" x="92" y="88" width="16" height="16" rx="6"/></svg><div class="head"><img id="headImg" alt="Fuula"><div id="mouth"></div></div></div></div>
  <div class="sub" id="sub">Barreeffama barreessi, dubbisi.</div>
</div>
<div class="row">
  <button id="bUp">Suuraa olkaa'i</button>
  <button id="bCam">Kaameraa</button>
  <button id="bSnap" hidden class="pri">Suuraa kaasi</button>
  <input type="file" id="file" accept="image/*">
</div>

<label for="txt">Barreeffama (script)</label>
<textarea id="txt" placeholder="Fkn: Nagaan dhuftan, har'a waa'ee ispoortii haasa'uu barbaada."></textarea>
<div class="row"><button id="bMic">Sagalee galmeessi</button></div>

<div class="two">
  <div><label for="lang">Afaan</label>
    <select id="lang"><option value="om">Afaan Oromoo</option><option value="am">Amharic</option><option value="en">English</option></select></div>
  <div><label for="voice">Sagalee</label><select id="voice"></select></div>
</div>

<label>Qaama</label>
<div class="row"><button id="bView">Qaama guutuu agarsiisi</button></div>
<label>Uffata fi kophee</label>
<div class="row" id="out"><button class="chip on" data-o="sport">Ispoortii</button><button class="chip" data-o="dance">Dhaansa</button><button class="chip" data-o="suit">Suuti</button><button class="chip" data-o="fant">Fantasy</button><button class="chip" data-o="work">Hojii</button><button class="chip" data-o="casual">Naannoo</button></div>
<label>Bakka</label>
<div class="row" id="scn"><button class="chip on" data-s="stad">Istaadiyeemii</button><button class="chip" data-s="stage">Dhaansa</button><button class="chip" data-s="fant">Fantasy</button><button class="chip" data-s="home">Manaa</button><button class="chip" data-s="beach">Galaana</button><button class="chip" data-s="class">Kutaa</button></div>
<label>Sochii</label>
<div class="row" id="mot"><button class="chip on" data-m="">Dhaabbii</button><button class="chip" data-m="dance">Dhaansa</button><button class="chip" data-m="sport">Ispoortii</button><button class="chip" data-m="wave">Harka kaasuu</button><button class="chip" data-m="ask">Gaaffii</button><button class="chip" data-m="point">Quba</button><button class="chip" data-m="dance2">Dhaansa 2</button><button class="chip" data-m="kick">Kubbaa miilaa</button><button class="chip" data-m="basket">Kubbaa kuusaa</button><button class="chip" data-m="box">Dhidhiiba</button><button class="chip" data-m="tennis">Tennis</button><button class="chip" data-m="mix">Walitti makame</button><button class="chip" data-m="walk">Deemuu</button><button class="chip" data-m="eat">Nyaachuu</button><button class="chip" data-m="drink">Dhuguu</button><button class="chip" data-m="read">Kitaaba dubbisuu</button><button class="chip" data-m="write">Barreessuu</button><button class="chip" data-m="listen">Dhaggeeffachuu</button><button class="chip" data-m="talk2">Nama waliin haasayuu</button><button class="chip" data-m="school">Mana barumsaa</button><button class="chip" data-m="home">Mana galuu</button><button class="chip" data-m="sleep">Rafuu</button><button class="chip" data-m="wake">Ka'uu</button><button class="chip" data-m="day">Guyyaa guutuu</button></div>
<label>Dugda cabsuu (bend)</label>
<div class="two"><div><label for="t1">Bitaa ↔ Mirga</label><input type="range" id="t1" min="-35" max="35" value="0" style="width:100%"></div><div><label for="t2">Duubatti ↔ Gadi</label><input type="range" id="t2" min="-35" max="50" value="0" style="width:100%"></div></div>
<label>Morma (neck)</label>
<div class="two"><div><label for="n1">Bitaa ↔ Mirga</label><input type="range" id="n1" min="-30" max="30" value="0" style="width:100%"></div><div><label for="n2">Duubatti ↔ Gadi</label><input type="range" id="n2" min="-35" max="40" value="0" style="width:100%"></div></div>
<label for="n3">Morma garagalchuu (bitaa ↔ mirga)</label>
<input type="range" id="n3" min="-50" max="50" value="0" style="width:100%">
<div class="row"><button id="bRs">Deebisi (reset)</button></div>
<label for="hg">Dheerina (height)</label>
<input type="range" id="hg" min="70" max="108" value="100" style="width:100%">
<label>Haala qaamaa</label>
<div class="row" id="pz"><button class="chip on" data-z="stand">Dhaabbadhu</button><button class="chip" data-z="sit">Taa'i</button><button class="chip" data-z="lie">Ciisi</button></div>
<div class="row"><button id="bBk">Dugda agarsiisi</button></div>
<label for="my">Iddoo afaanii (ol/gadi)</label>
<input type="range" id="my" min="60" max="85" value="72" style="width:100%">
<label>Sagalee ofii kee</label>
<div class="row"><button id="bRec">Sagalee koo waraabi</button><button id="bPlay" disabled>Sagalee kootiin dubbisi</button><button id="bAud">Sagalee faayila irraa fudhadhu</button><button id="bSng">Sirba filadhu</button><input type="file" id="sng" accept="audio/*"><input type="file" id="aud" accept="audio/*"></div>
<div class="row"><button class="pri" id="bVid">Viidiyoo hojjadhu</button><button id="bBack" hidden>Duubatti deebi'i</button></div>
<div id="pg" hidden style="margin:8px 0"><div style="height:10px;background:var(--line);border-radius:6px;overflow:hidden"><div id="pb" style="height:100%;width:0;background:var(--acc)"></div></div><div id="pt" style="font-size:13px;color:var(--mut);margin-top:4px"></div></div>
<label>Fuula (animation qofa)</label>
<div class="row" id="face"><button class="chip" data-f="photo">Suuraa kee</button><button class="chip" data-f="baby">Daa'ima</button><button class="chip" data-f="boy">Mucaa</button><button class="chip" data-f="girl">Intala</button><button class="chip" data-f="woman">Dubara</button><button class="chip" data-f="teen">Ka'ima</button><button class="chip on" data-f="man">Dargaggeessa</button><button class="chip" data-f="old">Jaarsa</button></div>
<label>Halluu gogaa</label>
<div class="row" id="skn"><button class="chip" data-k="#F6D5B8" style="background:#F6D5B8;min-width:44px" aria-label="Halluu 1"></button><button class="chip on" data-k="#E0AC83" style="background:#E0AC83;min-width:44px" aria-label="Halluu 2"></button><button class="chip" data-k="#B97A4F" style="background:#B97A4F;min-width:44px" aria-label="Halluu 3"></button><button class="chip" data-k="#7A4A2A" style="background:#7A4A2A;min-width:44px" aria-label="Halluu 4"></button><button class="chip" data-k="#4A2C18" style="background:#4A2C18;min-width:44px" aria-label="Halluu 5"></button></div>
<label>Rifeensa</label>
<div class="row" id="hst"><button class="chip on" data-h="">Duraan</button><button class="chip" data-h="short">Gabaabaa</button><button class="chip" data-h="afro">Afro</button><button class="chip" data-h="long">Dheeraa</button><button class="chip" data-h="braid">Hidhaa</button><button class="chip" data-h="bun">Bun</button><button class="chip" data-h="bald">Gogaa</button><button class="chip" data-h="beard">Areeda</button></div>
<label>Halluu rifeensaa</label>
<div class="row" id="hr"><button class="chip on" data-k="#1b1b1b" style="background:#1b1b1b;min-width:44px" aria-label="Gurraacha"></button><button class="chip" data-k="#5a3b1e" style="background:#5a3b1e;min-width:44px" aria-label="Bunaa"></button><button class="chip" data-k="#c9a35b" style="background:#c9a35b;min-width:44px" aria-label="Keelloo"></button><button class="chip" data-k="#b5432f" style="background:#b5432f;min-width:44px" aria-label="Diimaa"></button></div>
<label>Subtitles</label>
<div class="row" id="sbc"><button class="chip on" data-c="#ffffff">Adii</button><button class="chip" data-c="#ffd54a">Keelloo</button><button class="chip" data-c="#6fe3ff">Cuquliisa</button></div>
<input type="range" id="sbs" min="14" max="28" value="18" style="width:100%">
<label>Muuziqaa fi maqaa (viidiyoo keessatti)</label>
<div class="row"><button id="bMus">Muuziqaa filadhu</button><input type="file" id="mus" accept="audio/*"></div>
<input type="text" id="logo" placeholder="Maqaa ykn logo (fkn @maqaakee)" style="width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;color:var(--fg)">
<label>Miira</label>
<div class="row" id="emo">
  <button class="chip on" data-e="calm">Tasgabbii</button>
  <button class="chip" data-e="happy">Gammachuu</button>
  <button class="chip" data-e="sad">Gadda</button>
  <button class="chip" data-e="angry">Aarii</button><button class="chip" data-e="laugh">Kolfuu</button><button class="chip" data-e="cry">Gadduu</button>
</div>

<div class="row">
  <button class="pri" id="bSpeak">Dubbisi</button>
  <button id="bStop">Dhaabi</button>
</div>
<div id="st" role="status" aria-live="polite"></div>
</main>
<script>
var $=function(i){return document.getElementById(i)};
var stage=$('stage'),sub=$('sub'),st=$('st'),txt=$('txt'),emo='calm',imgEl=null,camStream=null,video=null;
var EMO={calm:{p:1,r:1,f:'none'},happy:{p:1.4,r:1.1,f:'saturate(1.3) brightness(1.08)'},sad:{p:.7,r:.8,f:'saturate(.55) brightness(.88)'},angry:{p:1.05,r:1.25,f:'saturate(1.5) contrast(1.15) hue-rotate(-10deg)'}};
var LC={om:'om-ET',am:'am-ET',en:'en-US'};
function msg(t){st.textContent=t}
function setImg(src){stopCam();if(!imgEl){imgEl=document.createElement('img');imgEl.alt='Avatar';stage.insertBefore(imgEl,stage.firstChild)}imgEl.src=src;$('headImg').src=src;$('ph').hidden=true;applyEmo();if(!full)$('bView').onclick()}
function applyEmo(){var f=EMO[emo].f;if(imgEl)imgEl.style.filter=f;var h=$('headImg');if(h)h.style.filter=f}
$('bUp').onclick=function(){$('file').click()};
$('file').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){setImg(r.result)};r.readAsDataURL(f)};
function stopCam(){if(camStream){camStream.getTracks().forEach(function(t){t.stop()});camStream=null}if(video){video.remove();video=null}$('bSnap').hidden=true}
$('bCam').onclick=function(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg('Kaameraan browser kana irratti hin hojjatu. Linkii kana Chrome ykn Safari keessatti bani.');return}
  navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}).then(function(s){
    camStream=s;video=document.createElement('video');video.srcObject=s;video.muted=true;video.playsInline=true;video.play();
    stage.insertBefore(video,stage.firstChild);$('ph').hidden=true;if(imgEl)imgEl.style.display='none';$('bSnap').hidden=false;msg('Kaameraan banameera.');
  }).catch(function(){msg('Kaameraa fayyadamuuf hayyama kenni.')});
};
$('bSnap').onclick=function(){
  if(!video)return;var c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;c.getContext('2d').drawImage(video,0,0);
  var d=c.toDataURL('image/jpeg',.9);if(imgEl)imgEl.style.display='';setImg(d);msg('Suuraan kaafameera.');
};
document.querySelectorAll('#emo button').forEach(function(b){b.onclick=function(){
  document.querySelectorAll('#emo button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');emo=b.dataset.e;applyEmo()}});
var vs=[];
function loadVoices(){
  vs=speechSynthesis.getVoices();var l=$('lang').value,pre=l==='om'?'om':l,sel=$('voice');sel.innerHTML='';
  var m=vs.filter(function(v){return v.lang.toLowerCase().indexOf(pre)===0});
  if(!m.length){m=vs.filter(function(v){return v.lang.toLowerCase().indexOf('en')===0});
    if(l!=='en')msg('Sagaleen '+(l==='om'?'Oromoo':'Amharic')+' browser kee keessa hin jiru. Subtitles fi sagalee galmeessuun ni hojjata; sagalee dhugaa booda dabalna.')}
  m.forEach(function(v){var o=document.createElement('option');o.value=vs.indexOf(v);o.textContent=v.name+' ('+v.lang+')';sel.appendChild(o)});
}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=loadVoices;loadVoices()}
$('lang').onchange=function(){msg('');loadVoices()};
function showWords(words,i){
  var s=Math.max(0,i-2),e=Math.min(words.length,i+5),h='';
  for(var k=s;k<e;k++){h+=(k===i?'<b>'+esc(words[k])+'</b>':esc(words[k]))+' '}
  sub.innerHTML=h;
}
function esc(t){return t.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
$('bSpeak').onclick=function(){
  var t=txt.value.trim();if(!t){msg('Dura barreeffama barreessi.');return}
  if(!('speechSynthesis' in window)){msg('Browser kee sagalee dubbisuu hin deeggaru.');return}
  speechSynthesis.cancel();
  var words=t.split(/\s+/),starts=[],pos=0;words.forEach(function(w){var ix=t.indexOf(w,pos);starts.push(ix);pos=ix+w.length});
  var u=new SpeechSynthesisUtterance(t),e=EMO[emo],idx=$('voice').value;
  if(idx!==''&&vs[idx]){u.voice=vs[idx];u.lang=vs[idx].lang}else u.lang=LC[$('lang').value];
  u.pitch=Math.min(2,e.p);u.rate=Math.min(2,e.r);
  var got=false;
  u.onstart=function(){stage.classList.add('talk');showWords(words,0)};
  u.onboundary=function(ev){got=true;var i=0;for(var k=0;k<starts.length;k++){if(starts[k]<=ev.charIndex)i=k}showWords(words,i)};
  u.onend=u.onerror=function(){stage.classList.remove('talk');sub.textContent=t};
  speechSynthesis.speak(u);
  setTimeout(function(){if(!got&&stage.classList.contains('talk'))sub.textContent=t},1200);
};
$('bStop').onclick=function(){if('speechSynthesis' in window)speechSynthesis.cancel();stage.classList.remove('talk')};
var fig=$('fig'),mouth=$('mouth'),full=false,an=null,ac=null,mr=null,chunks=[],blobUrl=null;
var OUT={sport:['#2E7D5B','#ffffff','#222222'],dance:['#C0392B','#1c1c1c','#C0392B'],suit:['#24324A','#3a3f4a','#111111'],fant:['#6C4BC1','#C9962B','#3b2a14']};
var SCN={stad:'linear-gradient(#9fd3ff,#6dbb6a 70%,#4f9a50)',stage:'radial-gradient(circle at 50% 30%,#8a5cff,#1b1033 70%)',fant:'linear-gradient(#f7b3d8,#7a6cf0 60%,#2c2a6e)',home:'linear-gradient(#f3e9d8,#d8c3a5)'};
function grp(sel,fn){document.querySelectorAll(sel+' button').forEach(function(b){b.onclick=function(){document.querySelectorAll(sel+' button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');fn(b)}})}
grp('#out',function(b){var o=OUT[b.dataset.o];fig.style.setProperty('--top',o[0]);fig.style.setProperty('--bot',o[1]);fig.style.setProperty('--shoe',o[2])});
grp('#scn',function(b){fig.style.background=SCN[b.dataset.s]});
grp('#mot',function(b){fig.classList.remove('dance','sport');if(b.dataset.m)fig.classList.add(b.dataset.m)});
$('my').oninput=function(){mouth.style.top=this.value+'%'};
$('bView').onclick=function(){full=!full;fig.hidden=!full;$('bView').textContent=full?'Fuula qofa agarsiisi':'Qaama guutuu agarsiisi';if(full&&!$('headImg').getAttribute('src'))msg('Dura suuraa fuulaa olkaa\'i.')};
function mouthLoop(){var h=0;if(an){var d=new Uint8Array(an.fftSize);an.getByteTimeDomainData(d);var s=0;for(var i=0;i<d.length;i++){var v=(d[i]-128)/128;s+=v*v}h=Math.min(1,Math.sqrt(s/d.length)*5)}else if(stage.classList.contains('talk')){h=.4+.4*Math.abs(Math.sin(Date.now()/110))}
 lvl=h;mouth.style.height=(2+h*9)+'%';mouth.style.opacity=h>.05?.6+h*.35:0;requestAnimationFrame(mouthLoop)}
mouthLoop();
$('bRec').onclick=function(){
 if(mr){mr.stop();return}
